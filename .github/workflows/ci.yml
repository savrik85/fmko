name: CI/CD

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]

jobs:
  # Main vzniká ze stromu testingu (commit-tree s rodiči main + testing). Když má
  # některý rodič stejný strom a jeho CI prošlo, testy už proběhly a nasazení
  # na produkci na ně nemusí čekat podruhé.
  tested-tree:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tree=$(git rev-parse HEAD^{tree})
            for p in $(git rev-list --parents -n1 HEAD | cut -d' ' -f2-); do
              [ "$(git rev-parse "$p^{tree}")" = "$tree" ] || continue
              n=$(gh run list --commit "$p" --workflow ci.yml --status success --json databaseId --jq length)
              echo "rodič $p má stejný strom, úspěšných běhů CI: $n"
              [ "$n" != "0" ] && tested=true
            done
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  typecheck:
    needs: tested-tree
    if: needs.tested-tree.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo typecheck
      - run: npx turbo test --filter=!@okresni-masina/api
      - run: node apps/web/check-links.mjs

  # Testy API (~6 000) na čtyřech strojích souběžně. fail-fast vypnutý, aby šlo
  # po nestabilním pádu Miniflare zopakovat jen spadlou část (gh run rerun --failed).
  test-api:
    needs: tested-tree
    if: needs.tested-tree.outputs.tested != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Spadlé soubory se hned zopakují v novém procesu (pád Miniflare, viz skript).
      - run: |
          npx vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile=vitest-report.json && exit 0
          node ../../scripts/ci-rerun-failed-tests.mjs vitest-report.json
        working-directory: apps/api

  deploy-api-prod:
    needs: [tested-tree, typecheck, test-api]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push'
      && (needs.tested-tree.outputs.tested == 'true'
          || (needs.typecheck.result == 'success' && needs.test-api.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          command: deploy

  deploy-web-prod:
    needs: [tested-tree, typecheck, test-api]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push'
      && (needs.tested-tree.outputs.tested == 'true'
          || (needs.typecheck.result == 'success' && needs.test-api.result == 'success'))
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.prales.fun
      NEXT_PUBLIC_SITE_URL: https://prales.fun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash add-edge-runtime.sh && npx @cloudflare/next-on-pages
        working-directory: apps/web
      # next-on-pages občas přepíše zástupce dynamického importu na neexistující
      # `async__chunk_…` a stránka pak vrací 500. Radši neprojít než to nasadit.
      - run: |
          if grep -rl "async__chunk_" .vercel/output/static/_worker.js; then
            echo "::error::next-on-pages rozbil dynamický import (async__chunk_), stránky výše by vracely 500"
            exit 1
          fi
        working-directory: apps/web
      - run: bash upload-sourcemaps.sh
        working-directory: apps/web
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: "279032"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/web
          command: pages deploy .vercel/output/static --project-name=prales-web --branch=main

  deploy-api-test:
    needs: [typecheck, test-api]
    if: >-
      !cancelled() && github.ref == 'refs/heads/testing' && github.event_name == 'push'
      && needs.typecheck.result == 'success' && needs.test-api.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          command: deploy --env testing

  deploy-web-test:
    needs: [typecheck, test-api]
    if: >-
      !cancelled() && github.ref == 'refs/heads/testing' && github.event_name == 'push'
      && needs.typecheck.result == 'success' && needs.test-api.result == 'success'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api-test.prales.fun
      NEXT_PUBLIC_SITE_URL: https://test.prales.fun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash add-edge-runtime.sh && npx @cloudflare/next-on-pages
        working-directory: apps/web
      # next-on-pages občas přepíše zástupce dynamického importu na neexistující
      # `async__chunk_…` a stránka pak vrací 500. Radši neprojít než to nasadit.
      - run: |
          if grep -rl "async__chunk_" .vercel/output/static/_worker.js; then
            echo "::error::next-on-pages rozbil dynamický import (async__chunk_), stránky výše by vracely 500"
            exit 1
          fi
        working-directory: apps/web
      - run: bash upload-sourcemaps.sh
        working-directory: apps/web
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: "279032"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/web
          command: pages deploy .vercel/output/static --project-name=prales-web-test --branch=testing
