name = "prales-api"
main = "src/index.ts"
compatibility_date = "2025-03-14"
compatibility_flags = ["nodejs_compat"]

[vars]
VAPID_SUBJECT = "mailto:admin@prales.fun"

# ═══ PRODUCTION (default — main branch) ═══

[[d1_databases]]
binding = "DB"
database_name = "prales-db-prod"
database_id = "87dfc1ba-d4f5-4158-8163-9f933b5d3571"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "8937f279d9a742339e53408470289ff1"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "6f565d070b8b4b7aa2d17009f484ec16"

[[r2_buckets]]
binding = "SEED_DATA"
bucket_name = "prales-seed"

# Workers AI — binding je k dispozici v obou prostředích, ale volá se jen když
# je přepínač ai_provider nastavený na "workers-ai". Produkce jede na Gemini.
[ai]
binding = "AI"

[triggers]
crons = [
  "0 3 * * *",
  "0 5 * * *",
  "0 6 * * *",
  "0 10 * * *",
  "0 14 * * *",
  "0 16 * * *",
  "5 16 * * *",
]

# ── Fronty (produkce) ──
# Jedna zpráva = jedna liga = jedna invokace s vlastním rozpočtem CPU a subrequestů.
# max_concurrency drží počet souběžných konzumerů nízko, aby se hrdlo jen nepřesunulo
# z workeru na D1 (viz docs/analyza-fronty-2026-08-16.md, riziko 4.3).
[[queues.producers]]
binding = "MATCH_QUEUE"
queue = "prales-match-rounds"

[[queues.producers]]
binding = "REPORTS_QUEUE"
queue = "prales-reports"

[[queues.consumers]]
queue = "prales-match-rounds"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 3
dead_letter_queue = "prales-match-dlq"

[[queues.consumers]]
queue = "prales-reports"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 2
dead_letter_queue = "prales-reports-dlq"

# DLQ konzumeři — selhání se jen zaznamená do queue_failures, ať nezmizí potichu.
[[queues.consumers]]
queue = "prales-match-dlq"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 0

[[queues.consumers]]
queue = "prales-reports-dlq"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 0

[[routes]]
pattern = "api.prales.fun"
custom_domain = true

# ═══ TESTING (testing branch) ═══

[env.testing]
name = "prales-api-test"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "api-test.prales.fun", custom_domain = true }
]

[env.testing.vars]
VAPID_SUBJECT = "mailto:admin@prales.fun"

[[env.testing.d1_databases]]
binding = "DB"
database_name = "prales-db-test"
database_id = "50b683da-6948-4ae5-8fe8-ee41a40d2e17"
migrations_dir = "migrations"

[[env.testing.kv_namespaces]]
binding = "SESSION_KV"
id = "5b7afe5ba1a646bca2c1c4f55eb5591a"

[[env.testing.kv_namespaces]]
binding = "CACHE_KV"
id = "f2900579992a4a8da17986f9b7d83f01"

[[env.testing.r2_buckets]]
binding = "SEED_DATA"
bucket_name = "prales-seed"

[env.testing.ai]
binding = "AI"

# ── Fronty (testing) ──
# VLASTNÍ fronty, jinak by si prostředí lezla do zelí (test konzumer by bral prod zprávy).
[[env.testing.queues.producers]]
binding = "MATCH_QUEUE"
queue = "prales-match-rounds-test"

[[env.testing.queues.producers]]
binding = "REPORTS_QUEUE"
queue = "prales-reports-test"

[[env.testing.queues.consumers]]
queue = "prales-match-rounds-test"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 2
dead_letter_queue = "prales-match-dlq-test"

[[env.testing.queues.consumers]]
queue = "prales-reports-test"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 2
dead_letter_queue = "prales-reports-dlq-test"

[[env.testing.queues.consumers]]
queue = "prales-match-dlq-test"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 0

[[env.testing.queues.consumers]]
queue = "prales-reports-dlq-test"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 0

# ── Crony (testing) ──
# Zrcadlo produkce, aby se testovací prostředí chovalo jako zmenšená produkce.
#
# Dřív tu bylo `crons = []` s pravidlem „testing crony nemá" — důvodem byl limit
# cronů na Free plánu (5/účet). Ověřeno 2026-08-17: účet je na Workers Paid
# (limit 250/účet) a napříč všemi workery jich běželo 8, takže prostor je volný.
#
# POZOR: testing sdílí s produkcí hodnotu GEMINI_API_KEY. Aby testovací crony
# neujídaly produkční kvótu, drží se přepínač `ai_provider` v testing CACHE_KV
# na "off" (nebo "workers-ai"). Default je "gemini", takže produkce je nedotčená.
[env.testing.triggers]
crons = [
  "0 3 * * *",
  "0 5 * * *",
  "0 6 * * *",
  "0 10 * * *",
  "0 14 * * *",
  "0 16 * * *",
  "5 16 * * *",
]
